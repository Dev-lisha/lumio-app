name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout lumio-app
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: lumio-app

      # lumio-app consumes @lumio/ui, @lumio/sdk and @lumio/shared via pnpm
      # `link:` to a sibling lumio-sdk checkout, so CI must lay them out as
      # siblings and build the SDK before the app.
      - name: Checkout lumio-sdk (sibling)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: lumio-network/lumio-sdk
          path: lumio-sdk

      - name: Resolve SDK revision
        id: sdk-revision
        run: echo "commit=$(git -C lumio-sdk rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache SDK build artifacts
        id: sdk-build-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            lumio-sdk/packages/sdk/dist
            lumio-sdk/packages/shared/dist
            lumio-sdk/packages/ui/dist
          key: ${{ runner.os }}-lumio-sdk-build-${{ hashFiles('lumio-sdk/pnpm-lock.yaml') }}-${{ steps.sdk-revision.outputs.commit }}

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.12.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: |
            lumio-sdk/pnpm-lock.yaml
            lumio-app/pnpm-lock.yaml

      - name: Build the SDK (provides the linked @lumio/* packages)
        if: steps.sdk-build-cache.outputs.cache-hit != 'true'
        working-directory: lumio-sdk
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Install app dependencies
        working-directory: lumio-app
        run: pnpm install --frozen-lockfile

      - name: Format check
        working-directory: lumio-app
        run: pnpm format:check

      - name: Lint
        working-directory: lumio-app
        run: pnpm lint

      - name: Typecheck
        working-directory: lumio-app
        run: pnpm typecheck

      - name: Build
        working-directory: lumio-app
        run: pnpm build

      - name: Test
        working-directory: lumio-app
        run: pnpm test

      - name: Test API
        working-directory: lumio-app/apps/api
        run: pnpm test:cov

      - name: Upload API coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: api-jest-coverage
          path: lumio-app/apps/api/coverage/
          if-no-files-found: ignore
          retention-days: 14
        continue-on-error: true
